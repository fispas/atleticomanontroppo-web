<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atletico ma non troppo</title>
<meta name="description" content="Presenze, squadre e statistiche del calcetto del mercoledì.">
<meta name="theme-color" content="#142541">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atletico">
<meta property="og:title" content="Atletico ma non troppo">
<meta property="og:description" content="Ci sei mercoledì? Segna la tua presenza.">
<meta property="og:image" content="assets/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  try { var t = JSON.parse(localStorage.getItem('tema')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --navy: #142541;
  --rosso: #BE0234;
  --azzurro: #04B6DA;
  --oro: #D1AD5E;
  --crema: #FFF6E3;
  --ok: #12965A;

  --bg: #EDF2F6;
  --surface: #FFFFFF;
  --surface-2: #F5F8FB;
  --ink: #142541;
  --ink-soft: #52607A;
  --line: #D8E0EA;
  --accent: var(--navy);
  --accent-ink: var(--crema);
  --focus: #04B6DA;
  --shadow: 0 1px 0 rgba(20, 37, 65, .06);

  --font-display: 'Fredoka', 'Baloo 2', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --tabbar-h: 72px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1426;
    --surface: #13213A;
    --surface-2: #1A2B48;
    --ink: #FFF6E3;
    --ink-soft: #A8B3C7;
    --line: #26385A;
    --accent: #FFF6E3;
    --accent-ink: #142541;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1426;
  --surface: #13213A;
  --surface-2: #1A2B48;
  --ink: #FFF6E3;
  --ink-soft: #A8B3C7;
  --line: #26385A;
  --accent: #FFF6E3;
  --accent-ink: #142541;
  --shadow: none;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.row { display: flex; align-items: center; gap: .6rem; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.stack.tight { gap: .4rem; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Shell ---------- */
.appbar { position: sticky; top: 0; z-index: 20; }
.topbar {
  display: flex; align-items: center; gap: .6rem;
  padding: calc(env(safe-area-inset-top, 0px) + .5rem) 1rem .5rem;
  background: var(--navy); color: var(--crema);
}
.topbar img { width: 34px; height: 34px; object-fit: contain; }
.topbar .title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; line-height: 1.05; }
.topbar .title span { display: block; font-size: .72rem; font-weight: 500; opacity: .8; letter-spacing: .02em; }
.topbar .icon-btn { margin-left: auto; color: var(--crema); }
.stripes {
  height: 6px;
  background: repeating-linear-gradient(90deg, var(--rosso) 0 18px, var(--azzurro) 18px 36px);
}
/* ---------- Striscia partita ---------- */
#matchbar:not(:empty) { background: var(--surface); border-bottom: 1px solid var(--line); }
.matchbar {
  max-width: 640px; margin: 0 auto;
  display: flex; align-items: center; gap: .6rem; padding: .4rem 1rem;
}
.matchbar .mb-main {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.matchbar .mb-when { font-family: var(--font-display); font-weight: 600; font-size: .92rem; line-height: 1.15; }
.matchbar .mb-where { font-size: .72rem; color: var(--ink-soft); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.matchbar .mb-count { font-family: var(--font-display); font-weight: 600; font-size: .9rem; white-space: nowrap; }
.matchbar .mb-count.full { color: var(--rosso); }
.matchbar .mb-me { font-size: 1.1rem; line-height: 1; }

/* ---------- Passi organizzazione ---------- */
.steps { display: flex; flex-direction: column; gap: .5rem; }
.steps ol { list-style: none; margin: 0; padding: 0; display: flex; gap: .35rem; }
.steps li { flex: 1; position: relative; padding-top: .5rem; font-size: .64rem; text-align: center; color: var(--ink-soft); }
.steps li::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; border-radius: 2px; background: currentColor; opacity: .25; }
.steps li.done { color: var(--ok); }
.steps li.now { color: var(--accent); font-weight: 700; }
.steps li.done::before, .steps li.now::before { opacity: 1; }
.hero .steps { margin-top: .9rem; background: rgba(9, 18, 34, .92); border-radius: 14px; padding: .65rem .7rem; }
.hero .steps li { color: rgba(255, 246, 227, .55); }
.hero .steps li.done { color: rgba(255, 246, 227, .92); }
.hero .steps li.now { color: var(--oro); }

/* ---------- Carta giocatore ---------- */
.carta {
  --c1: #F7E9A8; --c2: #D1AD5E; --c3: #A67C24;
  width: 100%; max-width: 300px; margin: 0 auto;
  padding: 1rem 1rem 2.6rem; color: #2B2008; text-align: center;
  background: linear-gradient(158deg, var(--c1) 0%, var(--c2) 46%, var(--c3) 100%);
  border-radius: 18px 18px 8px 8px;
  clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
  box-shadow: 0 8px 22px rgba(20, 37, 65, .28);
}
.carta.oro { --c1: #F9EDB4; --c2: #D9B562; --c3: #A67C24; }
.carta.argento { --c1: #F2F5F8; --c2: #BFC9D4; --c3: #8894A2; color: #1F2A38; }
.carta.bronzo { --c1: #F0D3B4; --c2: #C08347; --c3: #7E4A1E; color: #2E1A08; }
.carta-top { display: flex; align-items: flex-start; gap: .5rem; min-height: 96px; }
.carta-id { display: flex; flex-direction: column; align-items: center; gap: .1rem; line-height: 1; }
.carta-id .ov { font-family: var(--font-display); font-size: 2.5rem; font-weight: 700; }
.carta-id .ov.nuovo { font-size: 1.15rem; letter-spacing: .06em; padding: .55rem 0; }
.carta-id .ru { font-family: var(--font-display); font-weight: 600; font-size: .95rem; letter-spacing: .04em; }
.carta-id .crest-mini { width: 26px; height: 26px; margin-top: .35rem; object-fit: contain; }
.carta-foto { flex: 1; display: flex; align-items: flex-end; justify-content: center; min-width: 0; }
.carta-foto img { width: 104px; height: 104px; object-fit: cover; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); }
.carta-foto .emoji {
  width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem;
  background: color-mix(in srgb, var(--c) 30%, #fff); border: 2px solid rgba(255, 255, 255, .5);
}
.carta-nome {
  font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .03em;
  padding: .3rem 0 .35rem; margin: .4rem 0 .5rem;
  border-top: 1px solid rgba(43, 32, 8, .3); border-bottom: 1px solid rgba(43, 32, 8, .3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.carta-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem .5rem; }
.carta-stats .cs { display: flex; align-items: baseline; justify-content: center; gap: .25rem; }
.carta-stats .n { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.carta-stats .k { font-size: .7rem; font-weight: 600; opacity: .85; }
.carta-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: .1rem; }
.carta-nota { font-size: .72rem; color: var(--ink-soft); }

/* ---------- Medagliere ---------- */
.medagliere { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; }
.medaglia {
  display: inline-flex; align-items: center; gap: .3rem;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: .2rem .55rem .2rem .35rem; font-size: .74rem;
}
.medaglia .em { font-size: 1rem; }
.medaglia .tx em { font-style: normal; opacity: .7; }
.medaglia .volte { font-weight: 700; }

/* ---------- Pagelle ---------- */
.pagella {
  font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--surface-2); border-radius: 8px; padding: .1rem .45rem;
}
.pagella.top { background: color-mix(in srgb, var(--ok) 22%, var(--surface)); color: var(--ok); }
.pagella.giu { background: color-mix(in srgb, var(--rosso) 18%, var(--surface)); color: var(--rosso); }
/* Tabellino: gol e assist segnati dai giocatori */
.mio-tab { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.mio-btn {
  min-height: 92px; flex-direction: column; gap: .15rem; padding: .7rem .5rem;
  font-family: var(--font-display); font-size: 1rem; line-height: 1.1; position: relative;
}
.mio-btn .ico { font-size: 1.8rem; line-height: 1; }
.mio-btn em {
  font-style: normal; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem;
  line-height: 1; margin-top: .1rem;
}
.tab-lista { list-style: none; margin: 0; padding: 0; }
.tab-lista li { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-top: 1px solid var(--line); }
.tab-lista li:first-child { border-top: 0; }
.tab-n {
  font-family: var(--font-display); font-weight: 700; font-size: .95rem; white-space: nowrap;
  background: var(--surface-2); border-radius: 8px; padding: .12rem .5rem;
}

/* Pagelle: una scheda per giocatore */
.vota { display: flex; flex-direction: column; align-items: center; gap: .55rem; text-align: center; }
.vota-barra { width: 100%; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.vota-barra > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .25s ease; }
.vota-conta { font-size: .78rem; color: var(--ink-soft); }
.vota-faccia { width: 116px; height: 116px; }
.vota-faccia img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid var(--line); }
.vota-faccia .emoji {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 3rem;
  background: color-mix(in srgb, var(--c) 25%, var(--surface)); border: 3px solid var(--line);
}
.vota-nome { font-size: 1.35rem; }
.vota-griglia { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; width: 100%; }
.voto-n {
  min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; cursor: pointer;
  transition: transform .08s ease, background .15s ease;
}
.voto-n:active { transform: scale(.94); }
.voto-n.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.voto-n.alto.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.voto-n.basso.on { background: var(--rosso); border-color: var(--rosso); color: #fff; }
.vota-nav { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; width: 100%; }
.avatar.foto { overflow: hidden; padding: 0; }
.avatar.foto img { width: 100%; height: 100%; object-fit: cover; }

main#view {
  max-width: 640px; margin: 0 auto;
  padding: 1rem 1rem calc(var(--tabbar-h) + var(--safe-b) + 1.5rem);
  display: flex; flex-direction: column; gap: 1rem;
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: .82rem; font-weight: 600; color: var(--ink-soft); cursor: pointer; padding: 0;
}
.tabbar button .ico { font-size: 1.6rem; line-height: 1; filter: grayscale(1); opacity: .65; }
.tabbar button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabbar button[aria-current="page"] .ico { filter: none; opacity: 1; }
.tabbar button .dot { position: absolute; margin-left: 22px; margin-top: -26px; width: 8px; height: 8px; border-radius: 50%; background: var(--rosso); }

/* ---------- Elementi base ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 1rem; box-shadow: var(--shadow);
}
.card.flat { background: var(--surface-2); border-color: transparent; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; margin: .25rem 0 -.25rem; }
.section-title h2 { font-size: 1.15rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: 50px; padding: .6rem 1.1rem; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; text-decoration: none; text-align: center;
  transition: transform .08s ease;
}
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--rosso); border-color: color-mix(in srgb, var(--rosso) 40%, var(--line)); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.block { width: 100%; }
.btn.small { min-height: 42px; padding: .45rem .9rem; font-size: .92rem; border-radius: 11px; }
.icon-btn { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: inline-grid; place-items: center; color: var(--ink); }

.chips { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .15rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  min-height: 40px; display: inline-flex; align-items: center;
  padding: .4rem 1rem; font-size: .92rem; cursor: pointer; white-space: nowrap; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--ink-soft); }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--oro) 25%, transparent); color: color-mix(in srgb, var(--oro) 60%, var(--ink)); }
.pill.bad { background: color-mix(in srgb, var(--rosso) 14%, transparent); color: var(--rosso); }
.pill.info { background: color-mix(in srgb, var(--azzurro) 16%, transparent); color: color-mix(in srgb, var(--azzurro) 70%, var(--ink)); }

.avatar {
  flex: none; width: 36px; height: 36px; border-radius: 50%;
  display: inline-grid; place-items: center; font-size: 1.15rem; line-height: 1;
  background: var(--c, var(--azzurro));
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35);
}
.avatar.lg { width: 76px; height: 76px; font-size: 2.4rem; box-shadow: 0 0 0 3px var(--oro); }
.avatar.sm { width: 28px; height: 28px; font-size: .9rem; }
.avatar.guest { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px dashed var(--line); font-size: .8rem; color: var(--ink-soft); }

.empty { text-align: center; padding: 1.5rem 1rem; color: var(--ink-soft); }
.empty .big { font-size: 2rem; margin-bottom: .3rem; }

/* ---------- Hero partita ---------- */
.hero {
  position: relative; overflow: hidden;
  background: var(--navy); color: var(--crema);
  border-radius: 22px; padding: .9rem 1rem .85rem;
  box-shadow: inset 0 0 0 3px var(--oro);
}
.hero::after {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 34%;
  background: repeating-linear-gradient(90deg, var(--rosso) 0 14px, var(--azzurro) 14px 28px);
  opacity: .9; clip-path: polygon(38% 0, 100% 0, 100% 100%, 0 100%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero .when { font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; line-height: 1.06; max-width: 80%; }
.hero .time { font-family: var(--font-display); font-size: 1.05rem; opacity: .9; }
.hero .field-link { display: inline-flex; gap: .35rem; align-items: center; background: none; border: 0; padding: 0; color: var(--crema); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 600; text-align: left; }
.hero .meta { display: flex; flex-wrap: wrap; gap: .4rem .8rem; font-size: .85rem; max-width: 70%; opacity: .92; }
.hero .hero-actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .7rem; }
.hero .btn { background: rgba(9, 18, 34, .6); border-color: rgba(255, 246, 227, .28); color: var(--crema); }
.hero .btn.primary { background: var(--crema); color: var(--navy); border-color: var(--crema); }
.hero .weather { display: inline-flex; gap: .35rem; align-items: center; background: rgba(0,0,0,.25); padding: .2rem .55rem; border-radius: 999px; font-size: .85rem; }
.hero .countdown { font-size: .85rem; }
.hero.annullata { box-shadow: inset 0 0 0 3px var(--rosso); }
.banner { border-radius: 12px; padding: .7rem .9rem; font-weight: 600; }
.banner.bad { background: var(--rosso); color: #fff; }
.banner.info { background: color-mix(in srgb, var(--azzurro) 18%, var(--surface)); color: var(--ink); }
.banner.gold { background: color-mix(in srgb, var(--oro) 28%, var(--surface)); color: var(--ink); }

/* ---------- Presenza ---------- */
.presence-buttons {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  background: var(--surface-2); border: 2px solid var(--line); border-radius: 16px; padding: 4px;
}
.presence-buttons button {
  min-height: 60px; border-radius: 12px; border: 0; background: transparent;
  font-family: var(--font-display); font-weight: 600; font-size: .95rem; cursor: pointer; color: var(--ink-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; white-space: nowrap;
  transition: transform .08s ease, background .15s ease, color .15s ease;
}
.presence-buttons button .e { font-size: 1.45rem; line-height: 1; filter: grayscale(1); opacity: .65; }
.presence-buttons button .t { line-height: 1.1; }
.presence-buttons button:active { transform: scale(.96); }
.presence-buttons button[aria-pressed="true"] { color: #fff; box-shadow: 0 2px 8px rgba(20, 37, 65, .22); }
.presence-buttons button[aria-pressed="true"] .e { filter: none; opacity: 1; }
.presence-buttons button[data-stato="si"][aria-pressed="true"] { background: var(--ok); }
.presence-buttons button[data-stato="forse"][aria-pressed="true"] { background: var(--oro); color: var(--navy); }
.presence-buttons button[data-stato="no"][aria-pressed="true"] { background: var(--rosso); }
.presence-buttons button[disabled] { opacity: .55; cursor: not-allowed; }

.azioni-rapide { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.azioni-rapide .azione {
  min-height: 74px; flex-direction: column; gap: .2rem; padding: .6rem .5rem;
  font-size: .95rem; line-height: 1.15; text-align: center;
}
.azioni-rapide .azione .ico { font-size: 1.5rem; line-height: 1; }

<script type="module">
/* =====================================================================

const TZ = 'Europe/Rome';

const DEFAULT_CONFIG = {
  giornoSettimana: 3,
  ora: '21:00',
  durataMinuti: 60,
  campoPredefinito: null,
  minimoGiocatori: 10,
  chiusuraGiorniPrima: 0,
  chiusuraOra: '12:00',
  nomiSquadre: { a: 'Rossi', b: 'Azzurri' },
  badgeIronici: true,
  finestraPostPartitaOre: 48

/* ---------- Date in Europe/Rome ---------- */

const _dtfDate = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const _dtfParts = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit'
});

function romeDateStr(d = new Date()) {
  return _dtfDate.format(d);
}

function tzOffsetMs(ts) {
  const p = {};
  for (const part of _dtfParts.formatToParts(new Date(ts))) p[part.type] = part.value;
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return asUtc - Math.floor(ts / 1000) * 1000;
}

/** Converte data "YYYY-MM-DD" + ora "HH:MM" intese a Roma in un Date assoluto. */
function romeToDate(dateStr, timeStr = '00:00') {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [h, mi] = String(timeStr || '00:00').split(':').map(Number);
  const guess = Date.UTC(y, m - 1, d, h || 0, mi || 0);
  let ts = guess - tzOffsetMs(guess);
  const off2 = tzOffsetMs(ts);
  if (guess - off2 !== ts) ts = guess - off2;
  return new Date(ts);
}

function romeTimeStr(d) {
  const p = {};
  for (const part of _dtfParts.formatToParts(d)) p[part.type] = part.value;
  return `${String(+p.hour % 24).padStart(2, '0')}:${p.minute}`;
}

function addDaysStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

function weekdayOf(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}

function nextWeekdayDate(todayStr, weekday) {
  return addDaysStr(todayStr, (weekday - weekdayOf(todayStr) + 7) % 7);
}

function yearOf(dateStr) {
  return Number(String(dateStr).slice(0, 4));
}

const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function formatDataEstesa(dateStr) {
  const [, m, d] = dateStr.split('-').map(Number);
  return `${capitalize(GIORNI[weekdayOf(dateStr)])} ${d} ${MESI[m - 1]}`;
}

function formatDataBreve(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${GIORNI[weekdayOf(dateStr)].slice(0, 3)} ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${String(y).slice(2)}`;

/** Calcola inizio e chiusura iscrizioni di una partita. */
function computeMatchTimes(dateStr, ora, cfg) {
  const c = { ...DEFAULT_CONFIG, ...(cfg || {}) };
  const inizio = romeToDate(dateStr, ora || c.ora);
  let chiusura = romeToDate(addDaysStr(dateStr, -(Number(c.chiusuraGiorniPrima) || 0)), c.chiusuraOra || '12:00');

/* ---------- Coordinate da Google Maps ---------- */

function _validCoords(lat, lon) {
  lat = Number(lat); lon = Number(lon);
  if (!isFinite(lat) || !isFinite(lon)) return null;
  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
  return { lat: Math.round(lat * 1e6) / 1e6, lon: Math.round(lon * 1e6) / 1e6 };

function parseCoords(input) {
  if (!input) return null;
  let s = String(input).trim();
  try { s = decodeURIComponent(s); } catch (e) { /* lascia com'è */ }
  const patterns = [
    /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/,
    /@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,
    /[?&](?:q|ll|query|destination|center|daddr)=(?:loc:)?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i,
    /^\s*\(?\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*\)?\s*$/

  for (const re of patterns) {
    const m = s.match(re);
    if (m) {

/* ---------- Formazione: titolari, attesa, forse, no ---------- */

/**
 * presences: { playerId: { stato, tsIscrizione (ms|null), ospiti: [{id, nome, ts}] } }
 * activePlayerIds: array di id dei giocatori attivi
 */
function computeLineup(presences, posti, activePlayerIds) {
  const entries = [];
  const forse = [];
  const no = [];
  const answered = new Set();
  for (const [pid, p] of Object.entries(presences || {})) {
    if (!p) continue;
    if (p.stato) answered.add(pid);
    if (p.stato === 'si') entries.push({ key: pid, tipo: 'player', playerId: pid, ts: p.tsIscrizione ?? Number.MAX_SAFE_INTEGER });
    else if (p.stato === 'forse') forse.push(pid);
    else if (p.stato === 'no') no.push(pid);

function suggestCarrier(candidateIds, statsById, field, excludeId) {
  const volteKey = field === 'pallone' ? 'palloneVolte' : 'pettorineVolte';

  if (!list.length) return null;
  list.sort((a, b) => {
    const sa = statsById[a]?.totali || {}; const sb = statsById[b]?.totali || {};
    const va = sa[volteKey] || 0; const vb = sb[volteKey] || 0;
    if (va !== vb) return va - vb;
    const ua = sa[ultimaKey] || ''; const ub = sb[ultimaKey] || '';
    if (ua !== ub) return ua < ub ? -1 : 1;
    return a.localeCompare(b);
  });
  return list[0];
}

/* ---------- Squadre bilanciate ---------- */

function _pairKey(a, b) { return a < b ? `${a}|${b}` : `${b}|${a}`; }

function lastPairsFromTeams(squadre) {
  const set = new Set();
  for (const team of [squadre?.a || [], squadre?.b || []]) {
    for (let i = 0; i < team.length; i++) for (let j = i + 1; j < team.length; j++) set.add(_pairKey(team[i], team[j]));
  }
  return set;
}

/**
 * entries: [{ id, livello }]
 * Restituisce { a: [id], b: [id], diff }
 */
function balanceTeams(entries, lastPairs = new Set(), rng = Math.random) {
  const n = entries.length;
  if (n === 0) return { a: [], b: [], diff: 0 };
  const lvl = id => entries.find(e => e.id === id)?.livello ?? 3;
  const sum = team => team.reduce((s, id) => s + lvl(id), 0);
  const pairsSame = team => {
    let c = 0;
    for (let i = 0; i < team.length; i++) for (let j = i + 1; j < team.length; j++) if (lastPairs.has(_pairKey(team[i], team[j]))) c++;
    return c;
  };
  const score = (A, B) => Math.abs(sum(A) - sum(B)) * 1000 + pairsSame(A) + pairsSame(B);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  const odd = n % 2 === 1;
  let best = null;
  for (let restart = 0; restart < 24; restart++) {
    const sorted = shuffle(entries.map(e => ({ id: e.id, livello: e.livello ?? 3 })))
      .sort((x, y) => y.livello - x.livello);
    let A = []; let B = [];
    let pinned = null;
    let rest = sorted;
    if (odd) { pinned = sorted[0].id; A.push(pinned); rest = sorted.slice(1); }
    // serpentina: B A A B B A A B ...
    rest.forEach((e, k) => { ((k % 4 === 0 || k % 4 === 3) ? B : A).push(e.id); });
    // A = squadra corta (floor(n/2)) che, se dispari, contiene il livello più alto
    const targetA = Math.floor(n / 2);
    while (A.length > targetA) {
      let idx = -1;
      for (let i = A.length - 1; i >= 0; i--) if (A[i] !== pinned) { idx = i; break; }
      B.push(A.splice(idx, 1)[0]);
    }
    while (A.length < targetA) A.push(B.pop());

    let cur = score(A, B);
    for (let it = 0; it < 300; it++) {
      const ia = Math.floor(rng() * A.length); const ib = Math.floor(rng() * B.length);
      if (A[ia] === pinned || B[ib] === undefined || A[ia] === undefined) continue;
      const A2 = A.slice(); const B2 = B.slice();
      [A2[ia], B2[ib]] = [B2[ib], A2[ia]];
      const s = score(A2, B2);
      if (s <= cur) { A = A2; B = B2; cur = s; }
    }
    if (!best || cur < best.score || (cur === best.score && rng() < 0.5)) best = { a: A, b: B, score: cur };
  }
  return { a: best.a, b: best.b, diff: Math.abs(sum(best.a) - sum(best.b)) };
}

/* ---------- MVP ---------- */

function golByPlayerOfMatch(match) {
  const g = {};
  for (const m of match.marcatori || []) g[m.playerId] = (g[m.playerId] || 0) + (Number(m.gol) || 0);
  return g;
}

function teamOf(match, id) {
  if ((match.squadre?.a || []).includes(id)) return 'a';
  if ((match.squadre?.b || []).includes(id)) return 'b';
  return null;
}

function computeMvp(votes, match) {
  const count = {};
  for (const v of votes || []) if (v?.votatoPer) count[v.votatoPer] = (count[v.votatoPer] || 0) + 1;
  const ids = Object.keys(count);
  if (!ids.length) return [];
  const max = Math.max(...ids.map(id => count[id]));
  const tied = ids.filter(id => count[id] === max).sort();
  if (tied.length === 1) return tied;
  const golA = Number(match.golA) || 0; const golB = Number(match.golB) || 0;
  const win = golA > golB ? 'a' : golB > golA ? 'b' : null;
  if (!win) return tied;
  const inWin = tied.filter(id => teamOf(match, id) === win);
  if (!inWin.length) return tied;
  const g = golByPlayerOfMatch(match);
  const maxG = Math.max(...inWin.map(id => g[id] || 0));
  const top = inWin.filter(id => (g[id] || 0) === maxG);
  return top.length === 1 ? top : tied;
}

/* ---------- Statistiche ---------- */

function _emptyCounters() {
  return {
    presenze: 0, gol: 0, mediaGol: 0, vittorie: 0, pareggi: 0, sconfitte: 0, percVittorie: 0, mvp: 0,
    assist: 0, partite3assist: 0, pali: 0, partiteVotate: 0, sommaMedie: 0, mediaVoto: 0, partiteVoto8: 0, partiteVoto5: 0, ritiriLastMinute: 0, assenze: 0, palloneVolte: 0, pettorineVolte: 0,
    ospitiPortati: 0, primoIscrittoVolte: 0, entratoDaAttesaVolte: 0, restatoInAttesaVolte: 0,

}

function _finalizeCounters(c, campiSet) {
  c.mediaGol = c.presenze ? Math.round((c.gol / c.presenze) * 100) / 100 : 0;
  c.mediaAssist = c.presenze ? Math.round((c.assist / c.presenze) * 100) / 100 : 0;
  c.mediaVoto = c.partiteVotate ? Math.round((c.sommaMedie / c.partiteVotate) * 100) / 100 : 0;

  if (campiSet) c.campiDiversi = campiSet.size;
  return c;
}

function _tsMs(v) {
  if (v == null) return null;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  if (v instanceof Date) return v.getTime();
  if (typeof v.seconds === 'number') return v.seconds * 1000 + Math.floor((v.nanoseconds || 0) / 1e6);
  return null;
}

/**
 * Ricalcolo completo e idempotente.
 * input: {
 *   matches: [{ id, data, fieldId, stato, squadre, golA, golB, marcatori, assist, pali, assenti,
 *               pallone, pettorine, mvp: [ids], inizio (ms), chiusura (ms), posti }],
 *   presencesByMatch: { matchId: { playerId: { stato, tsIscrizione, ospiti:[{id,nome,ts}] } } },
 *   reviewsByMatch: { matchId: { playerId: { fieldId, voto, criteri, commento, nascosto, ts } } },
 *   logs: [{ matchId, azione, target, prima, dopo, ts, dettaglio }],
 *   players: { id: { nome, ruolo, attivo } },
 *   config, nowMs
 * }
 */
function computeAllStats(input) {
  const cfg = { ...DEFAULT_CONFIG, ...(input.config || {}) };
  const nowMs = input.nowMs ?? Date.now();
  const currentYear = yearOf(romeDateStr(new Date(nowMs)));
  const players = input.players || {};
  const playerIds = Object.keys(players);
  const matches = (input.matches || [])
    .filter(m => m.stato === 'giocata' || m.stato === 'archiviata')
    .slice()
    .sort((a, b) => a.data.localeCompare(b.data));

  const logsByMatch = {};
  for (const l of input.logs || []) {
    if (!l.matchId) continue;
    (logsByMatch[l.matchId] = logsByMatch[l.matchId] || []).push(l);
  }
  for (const k of Object.keys(logsByMatch)) logsByMatch[k].sort((a, b) => (a.ts || 0) - (b.ts || 0));

  const S = {};
  const ensure = pid => {
    if (!S[pid]) {
      S[pid] = {
        totali: _emptyCounters(), perAnno: {}, campi: new Set(), campiAnno: {},
        serie: { presenzeConsecutiveAttuale: 0, presenzeConsecutiveMax: 0, vittorieAttuale: 0, vittorieMax: 0,
          sconfitteAttuale: 0, sconfitteMax: 0, pareggiAttuale: 0, pareggiMax: 0, senzaGolAttuale: 0, senzaGolMax: 0,
          senzaRitiriAttuale: 0, senzaRitiriMax: 0, mvpConsecutiviAttuale: 0, mvpConsecutiviMax: 0 },
        record: { maxGolPartita: { gol: 0, data: null, matchId: null }, maxGolAnno: { gol: 0, anno: null }, maxVotoPartita: { voto: 0, data: null, matchId: null } },
        formaAll: [], compagni: {}, avversari: {}, perCampo: {}, votiDati: [],
        ultimoPallone: null, ultimePettorine: null, lastOwn: null,
        badgeLevels: {}, badge: []
      };
    }
    return S[pid];
  };
  const yearC = (pid, anno) => {
    const s = ensure(pid);
    if (!s.perAnno[anno]) { s.perAnno[anno] = _emptyCounters(); s.campiAnno[anno] = new Set(); }
    return s.perAnno[anno];
  };
  const inc = (pid, anno, key, n = 1) => { ensure(pid).totali[key] += n; yearC(pid, anno)[key] += n; };
  const bump = (serie, key, cond) => {
    if (cond) { serie[key + 'Attuale']++; if (serie[key + 'Attuale'] > serie[key + 'Max']) serie[key + 'Max'] = serie[key + 'Attuale']; } else serie[key + 'Attuale'] = 0;
  };

  const fieldAgg = {};
  const ensureField = fid => {
    if (!fieldAgg[fid]) fieldAgg[fid] = { partite: 0, gol: 0, reviews: [], marcatori: {}, rendimento: {} };
    return fieldAgg[fid];
  };

  const metricValue = (pid) => {
    const s = S[pid];
    const t = s.totali;
    const annoMax = key => Math.max(0, ...Object.values(s.perAnno).map(c => c[key] || 0));
    const votes = s.votiDati;
    const media = votes.length ? votes.reduce((a, b) => a + b, 0) / votes.length : 0;
    return {
      presenze: t.presenze, gol: t.gol, mvp: t.mvp, assist: t.assist, pali: t.pali,
      altruista: t.presenze >= 10 && t.assist > t.gol ? 1 : 0,
      presenzeConsecutiveMax: s.serie.presenzeConsecutiveMax, vittorieMax: s.serie.vittorieMax,
      sconfitteMax: s.serie.sconfitteMax, pareggiMax: s.serie.pareggiMax, senzaGolMax: s.serie.senzaGolMax,
      senzaRitiriMax: s.serie.senzaRitiriMax, mvpConsecutiviMax: s.serie.mvpConsecutiviMax,
      partite2gol: t.partite2gol, partite3gol: t.partite3gol, partite4gol: t.partite4gol, rimonte: t.rimonte, partite3assist: t.partite3assist,
      partiteVoto8: t.partiteVoto8, partiteVoto5: t.partiteVoto5,
      topPlayer: t.partiteVotate >= 10 && (t.sommaMedie / t.partiteVotate) >= 7.5 ? 1 : 0,
      supereroe: t.supereroe, primoIscrittoVolte: t.primoIscrittoVolte, magazzino: t.palloneVolte + t.pettorineVolte,
      ospitiPortati: t.ospitiPortati, campiDiversi: s.campi.size, recensioniCampo: t.recensioniCampo,
      forseAnnoMax: annoMax('forseVolte'), ritiriAnnoMax: annoMax('ritiriLastMinute'), assenzeAnnoMax: annoMax('assenze'),
      restatoInAttesaVolte: t.restatoInAttesaVolte, lastMinuteVolte: t.lastMinuteVolte,
      maiContento: votes.length >= 5 && media <= 2 ? 1 : 0
    };
  };

  const evalBadges = (pid, data, matchId) => {
    const s = S[pid];
    const vals = metricValue(pid);
    for (const b of BADGES) {
      if (b.tipo === 'annuale') continue;
      if (b.ironico && !cfg.badgeIronici) continue;
      if (b.noPortiere && players[pid]?.ruolo === 'portiere') continue;
      const v = vals[b.metric] || 0;
      let lvl = 0;
      b.soglie.forEach((th, i) => { if (v >= th) lvl = i + 1; });
      const prev = s.badgeLevels[b.id] || 0;
      if (lvl > prev) {
        s.badgeLevels[b.id] = lvl;
        s.badge = s.badge.filter(x => x.id !== b.id);
        s.badge.push({ id: b.id, livello: lvl, sbloccatoIl: data, matchId, volte: 1 });
      }
    }
  };

  for (const m of matches) {
    const anno = yearOf(m.data);
    const teamA = (m.squadre?.a || []);
    const teamB = (m.squadre?.b || []);
    const inTeams = new Set([...teamA, ...teamB]);
    const giocatori = [...inTeams].filter(id => !String(id).startsWith('ospite:') && players[id]);
    const golA = Number(m.golA) || 0; const golB = Number(m.golB) || 0;
    const gol = golByPlayerOfMatch(m);
    const assist = {}; for (const x of m.assist || []) assist[x.playerId] = (assist[x.playerId] || 0) + (Number(x.n) || 0);
    const pali = {}; for (const x of m.pali || []) pali[x.playerId] = (pali[x.playerId] || 0) + (Number(x.n) || 0);
    const pagelle = {};
    for (const x of m.pagelle || []) {
      const media = Number(x?.media);
      if (x?.playerId && isFinite(media) && media > 0) pagelle[x.playerId] = Math.min(10, Math.max(1, media));
    }
    const mvpSet = new Set(m.stato === 'archiviata' ? (m.mvp || []) : []);
    const presences = input.presencesByMatch?.[m.id] || {};
    const reviews = input.reviewsByMatch?.[m.id] || {};
    const logs = logsByMatch[m.id] || [];
    const fa = m.fieldId ? ensureField(m.fieldId) : null;
    const inizio = _tsMs(m.inizio) ?? romeToDate(m.data, m.ora || cfg.ora).getTime();
    const chiusura = _tsMs(m.chiusura) ?? computeMatchTimes(m.data, m.ora, cfg).chiusura.getTime();

    if (fa) { fa.partite++; fa.gol += golA + golB; }

    // Eventi dai log
    const ritiri = new Set();
    for (const l of logs) {
      if (l.azione !== 'presenza' || !players[l.target]) continue;
      const ts = l.ts || 0;
      if (l.prima === 'si' && (l.dopo === 'no' || l.dopo === 'forse') && ts >= inizio - 24 * 3600e3 && ts <= inizio) {
        inc(l.target, anno, 'ritiriLastMinute'); ritiri.add(l.target);
      }
      if (l.prima !== 'si' && l.dopo === 'si') {
        const siPrima = Number(l.dettaglio?.siPrima);
        if (ts >= inizio - 24 * 3600e3 && ts <= inizio && isFinite(siPrima) && siPrima < (Number(cfg.minimoGiocatori) || 0)) inc(l.target, anno, 'supereroe');
        if (ts >= chiusura - 2 * 3600e3 && ts <= chiusura) inc(l.target, anno, 'lastMinuteVolte');
      }
    }
    const promossi = new Set(logs.filter(l => l.azione === 'promozione').map(l => l.target));

    // Presenze dichiarate
    const lineup = computeLineup(presences, Number(m.posti) || 0, []);
    let primo = null;
    for (const e of lineup.titolari.concat(lineup.attesa)) {
      if (e.tipo === 'player' && players[e.playerId] && e.ts !== Number.MAX_SAFE_INTEGER) { primo = e.playerId; break; }
    }
    if (primo) inc(primo, anno, 'primoIscrittoVolte');
    for (const e of lineup.attesa) if (e.tipo === 'player' && players[e.playerId] && !inTeams.has(e.playerId)) inc(e.playerId, anno, 'restatoInAttesaVolte');
    for (const pid of lineup.forse) if (players[pid]) inc(pid, anno, 'forseVolte');
    for (const pid of m.assenti || []) if (players[pid]) inc(pid, anno, 'assenze');

    // Ospiti portati
    for (const id of inTeams) {
      const parts = String(id).split(':');
      if (parts[0] === 'ospite' && players[parts[1]]) inc(parts[1], anno, 'ospitiPortati');
    }

    // Partita giocata
    for (const pid of giocatori) {
      const s = ensure(pid);
      const team = teamA.includes(pid) ? 'a' : 'b';
      const my = team === 'a' ? golA : golB; const opp = team === 'a' ? golB : golA;
      const esito = my > opp ? 'V' : my < opp ? 'S' : 'P';
      const g = gol[pid] || 0;
      inc(pid, anno, 'presenze');
      inc(pid, anno, 'gol', g);
      if (esito === 'V') inc(pid, anno, 'vittorie'); else if (esito === 'S') inc(pid, anno, 'sconfitte'); else inc(pid, anno, 'pareggi');
      if (mvpSet.has(pid)) inc(pid, anno, 'mvp');
      if (assist[pid]) inc(pid, anno, 'assist', assist[pid]);
      if ((assist[pid] || 0) >= 3) inc(pid, anno, 'partite3assist');
      const voto = pagelle[pid];
      if (voto) {
        inc(pid, anno, 'partiteVotate');
        inc(pid, anno, 'sommaMedie', voto);
        if (voto >= 8) inc(pid, anno, 'partiteVoto8');
        if (voto < 5) inc(pid, anno, 'partiteVoto5');
        if (voto > s.record.maxVotoPartita.voto) s.record.maxVotoPartita = { voto, data: m.data, matchId: m.id };
      }
      if (pali[pid]) inc(pid, anno, 'pali', pali[pid]);
      if (g >= 2) inc(pid, anno, 'partite2gol');
      if (g >= 3) inc(pid, anno, 'partite3gol');
      if (g >= 4) inc(pid, anno, 'partite4gol');
      if (m.pallone === pid) { inc(pid, anno, 'palloneVolte'); s.ultimoPallone = m.data; }
      if (m.pettorine === pid) { inc(pid, anno, 'pettorineVolte'); s.ultimePettorine = m.data; }
      if (promossi.has(pid)) inc(pid, anno, 'entratoDaAttesaVolte');
      if (m.fieldId) { s.campi.add(m.fieldId); yearC(pid, anno); s.campiAnno[anno].add(m.fieldId); }

      if (esito === 'V' && s.lastOwn && s.lastOwn.esito === 'S' && s.lastOwn.scarto >= 3 && my - opp >= 3) inc(pid, anno, 'rimonte');

      bump(s.serie, 'vittorie', esito === 'V');
      bump(s.serie, 'sconfitte', esito === 'S');
      bump(s.serie, 'pareggi', esito === 'P');
      bump(s.serie, 'senzaGol', g === 0);
      bump(s.serie, 'mvpConsecutivi', mvpSet.has(pid));

      if (g > s.record.maxGolPartita.gol) s.record.maxGolPartita = { gol: g, data: m.data, matchId: m.id };
      s.formaAll.push({ matchId: m.id, data: m.data, esito, gol: g, mvp: mvpSet.has(pid) });
      s.lastOwn = { esito, scarto: Math.abs(my - opp) };

      const mates = (team === 'a' ? teamA : teamB).filter(x => x !== pid && players[x]);
      const opps = (team === 'a' ? teamB : teamA).filter(x => players[x]);
      for (const x of mates) { const c = s.compagni[x] = s.compagni[x] || { playerId: x, partiteInsieme: 0, vittorieInsieme: 0 }; c.partiteInsieme++; if (esito === 'V') c.vittorieInsieme++; }
      for (const x of opps) { const c = s.avversari[x] = s.avversari[x] || { playerId: x, partiteContro: 0, sconfitteContro: 0 }; c.partiteContro++; if (esito === 'S') c.sconfitteContro++; }

      if (m.fieldId) {
        const pc = s.perCampo[m.fieldId] = s.perCampo[m.fieldId] || { fieldId: m.fieldId, presenze: 0, gol: 0, vittorie: 0 };
        pc.presenze++; pc.gol += g; if (esito === 'V') pc.vittorie++;
        if (fa) {
          fa.marcatori[pid] = (fa.marcatori[pid] || 0) + g;
          const r = fa.rendimento[pid] = fa.rendimento[pid] || { partite: 0, vittorie: 0 };
          r.partite++; if (esito === 'V') r.vittorie++;
        }
      }
    }

    // Serie su tutte le partite
    for (const pid of playerIds) {
      const s = ensure(pid);
      const played = giocatori.includes(pid);
      bump(s.serie, 'presenzeConsecutive', played);
      if (ritiri.has(pid)) { s.serie.senzaRitiriAttuale = 0; } else if (played) {
        s.serie.senzaRitiriAttuale++; if (s.serie.senzaRitiriAttuale > s.serie.senzaRitiriMax) s.serie.senzaRitiriMax = s.serie.senzaRitiriAttuale;
      }
    }

    // Recensioni campi
    for (const [pid, r] of Object.entries(reviews)) {
      if (!r || !r.voto) continue;
      if (players[pid]) { inc(pid, anno, 'recensioniCampo'); ensure(pid).votiDati.push(Number(r.voto)); }
      const fid = r.fieldId || m.fieldId;
      if (fid) ensureField(fid).reviews.push({ ...r, playerId: pid, matchId: m.id, data: m.data });
    }

    const touched = new Set([...giocatori, ...ritiri, ...Object.keys(reviews), ...lineup.forse, ...(m.assenti || []), ...(primo ? [primo] : []),
      ...lineup.attesa.filter(e => e.tipo === 'player').map(e => e.playerId), ...logs.map(l => l.target)]);
    for (const pid of touched) if (players[pid]) evalBadges(pid, m.data, m.id);
  }

  // Premi annuali
  const yearAwards = {};
  const years = new Set();
  for (const s of Object.values(S)) for (const a of Object.keys(s.perAnno)) years.add(Number(a));
  const topOf = (anno, key, filter = () => true) => {
    let best = 0; let ids = [];
    for (const pid of Object.keys(S)) {
      const c = S[pid].perAnno[anno];
      if (!c || !filter(c)) continue;
      const v = c[key] || 0;
      if (v <= 0) continue;
      if (v > best) { best = v; ids = [pid]; } else if (v === best) ids.push(pid);
    }
    return ids.map(playerId => ({ playerId, valore: best }));
  };
  for (const pid of Object.keys(S)) for (const [anno, c] of Object.entries(S[pid].perAnno)) _finalizeCounters(c, S[pid].campiAnno[anno]);
  for (const anno of [...years].sort()) {
    const concluso = anno < currentYear;
    yearAwards[anno] = {
      anno, concluso,
      capocannoniere: topOf(anno, 'gol'),
      pallaDoro: topOf(anno, 'mediaVoto', c => c.partiteVotate >= 3),
      reAssist: topOf(anno, 'assist'),
      mvpAnno: topOf(anno, 'mvp'),
      piuPresenze: topOf(anno, 'presenze'),
      piuVittorie: topOf(anno, 'vittorie'),
      portafortuna: topOf(anno, 'percVittorie', c => c.presenze >= 10)
    };
    if (!concluso) continue;
    for (const [award, badgeId] of [['capocannoniere', 'capocannoniere'], ['portafortuna', 'portafortuna']]) {
      for (const w of yearAwards[anno][award]) {
        const s = S[w.playerId];
        const ex = s.badge.find(x => x.id === badgeId);
        if (ex) { ex.volte = (ex.volte || 1) + 1; ex.sbloccatoIl = `${anno}-12-31`; ex.anni = [...(ex.anni || []), anno]; }
        else s.badge.push({ id: badgeId, livello: 1, sbloccatoIl: `${anno}-12-31`, matchId: null, volte: 1, anni: [anno] });
      }
    }
  }

  // Carta giocatore: valori 0-99 rapportati al gruppo
  for (const pid of playerIds) { const s = ensure(pid); _finalizeCounters(s.totali, s.campi); }
  const attivi = playerIds.filter(pid => S[pid] && S[pid].totali.presenze > 0);
  const maxDi = fn => Math.max(0, ...attivi.map(pid => fn(S[pid].totali)));
  const maxMediaGol = maxDi(c => c.mediaGol);
  const maxMediaAssist = maxDi(c => c.mediaAssist);
  const maxMvpRatio = maxDi(c => (c.presenze ? c.mvp / c.presenze : 0));
  const cap99 = v => Math.max(30, Math.min(99, Math.round(v)));
  const rapporta = (v, max) => (!max || v <= 0) ? 40 : cap99(45 + 54 * (v / max));

  function cartaDi(t) {
    const voci = [
      { key: 'VOT', nome: 'Media voto', valore: t.partiteVotate ? cap99(t.mediaVoto * 10) : 60, peso: 0.30 },
      { key: 'GOL', nome: 'Gol', valore: rapporta(t.mediaGol, maxMediaGol), peso: 0.15 },
      { key: 'ASS', nome: 'Assist', valore: rapporta(t.mediaAssist, maxMediaAssist), peso: 0.15 },
      { key: 'MVP', nome: 'MVP', valore: rapporta(t.presenze ? t.mvp / t.presenze : 0, maxMvpRatio), peso: 0.15 },
      { key: 'VIT', nome: 'Vittorie', valore: cap99(t.percVittorie), peso: 0.10 },
      { key: 'PRE', nome: 'Presenza', valore: cap99(affidabilita(t)), peso: 0.15 }
    ];
    if (t.presenze < 3) return { overall: null, rarita: 'bronzo', partiteMancanti: 3 - t.presenze, voci };
    const overall = Math.round(voci.reduce((s, v) => s + v.valore * v.peso, 0));
    return { overall, rarita: overall >= 85 ? 'oro' : overall >= 70 ? 'argento' : 'bronzo', partiteMancanti: 0, voci };
  }

  // Output giocatori
  const playerStats = {};
  for (const pid of playerIds) {
    const s = ensure(pid);
    const t = _finalizeCounters(s.totali, s.campi);
    t.ultimoPallone = s.ultimoPallone; t.ultimePettorine = s.ultimePettorine;
    for (const [anno, c] of Object.entries(s.perAnno)) {
      if (c.gol > s.record.maxGolAnno.gol) s.record.maxGolAnno = { gol: c.gol, anno: Number(anno) };
    }
    const vals = metricValue(pid);
    const progressi = {};
    for (const b of BADGES) {
      if (b.tipo === 'annuale' || (b.ironico && !cfg.badgeIronici)) continue;
      const lvl = s.badgeLevels[b.id] || 0;
      progressi[b.id] = { valore: vals[b.metric] || 0, prossimaSoglia: b.soglie[lvl] ?? null, livello: lvl };
    }
    const perCampo = Object.values(s.perCampo).map(pc => ({ ...pc, percVittorie: pc.presenze ? Math.round((pc.vittorie / pc.presenze) * 1000) / 10 : 0 }));
    const prefer = perCampo.filter(pc => pc.presenze >= 3).sort((a, b) => b.percVittorie - a.percVittorie || b.presenze - a.presenze)[0];
    const serie = { ...s.serie };
    playerStats[pid] = {
      carta: cartaDi(t),
      totali: t,
      perAnno: s.perAnno,
      serie,
      record: s.record,
      forma: s.formaAll.slice(-10),
      compagni: Object.values(s.compagni).sort((a, b) => b.vittorieInsieme - a.vittorieInsieme || b.partiteInsieme - a.partiteInsieme).slice(0, 5),
      avversari: Object.values(s.avversari).sort((a, b) => b.sconfitteContro - a.sconfitteContro || b.partiteContro - a.partiteContro).slice(0, 5),
      compagnoIdeale: Object.values(s.compagni).filter(c => c.partiteInsieme >= 3).sort((a, b) => b.vittorieInsieme - a.vittorieInsieme || a.partiteInsieme - b.partiteInsieme)[0] || null,
      bestiaNera: Object.values(s.avversari).filter(c => c.partiteContro >= 3).sort((a, b) => b.sconfitteContro - a.sconfitteContro || a.partiteContro - b.partiteContro)[0] || null,
      perCampo,
      campoPreferito: prefer ? prefer.fieldId : null,
      mediaVotiDatiCampi: s.votiDati.length ? Math.round((s.votiDati.reduce((a, b) => a + b, 0) / s.votiDati.length) * 10) / 10 : null,
      badge: s.badge.sort((a, b) => String(b.sbloccatoIl).localeCompare(String(a.sbloccatoIl))),
      progressi
    };
  }

  // Output campi
  const fieldStats = {};
  const CRITERI = ['fondo', 'illuminazione', 'spogliatoi', 'qualitaPrezzo'];
  for (const [fid, f] of Object.entries(fieldAgg)) {
    const vis = f.reviews.filter(r => !r.nascosto);
    const distribuzione = [0, 0, 0, 0, 0];
    for (const r of vis) { const v = Math.min(5, Math.max(1, Math.round(Number(r.voto)))); distribuzione[v - 1]++; }
    const mediaCriteri = {};
    for (const c of CRITERI) {
      const vals = vis.map(r => Number(r.criteri?.[c])).filter(v => v >= 1 && v <= 5);
      mediaCriteri[c] = vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10 : null;
    }
    const cap = Object.entries(f.marcatori).filter(([, g]) => g > 0).sort((a, b) => b[1] - a[1])[0];
    const rend = Object.entries(f.rendimento).filter(([, r]) => r.partite >= 3)
      .map(([pid, r]) => ({ playerId: pid, perc: Math.round((r.vittorie / r.partite) * 1000) / 10, partite: r.partite }))
      .sort((a, b) => b.perc - a.perc || b.partite - a.partite)[0];
    fieldStats[fid] = {
      mediaVoto: vis.length ? Math.round((vis.reduce((a, r) => a + Number(r.voto), 0) / vis.length) * 10) / 10 : null,
      numeroVoti: vis.length,
      distribuzione,
      mediaCriteri,
      partiteGiocate: f.partite,
      mediaGolPartita: f.partite ? Math.round((f.gol / f.partite) * 10) / 10 : null,
      ultimeRecensioni: vis.slice().sort((a, b) => String(b.data).localeCompare(String(a.data)) || (b.ts || 0) - (a.ts || 0)).slice(0, 10)
        .map(r => ({ playerId: r.playerId, matchId: r.matchId, voto: Number(r.voto), commento: r.commento || '', data: r.data, criteri: r.criteri || {} })),
      capocannoniere: cap ? { playerId: cap[0], gol: cap[1] } : null,
      migliorRendimento: rend || null
    };
  }

  return { playerStats, fieldStats, yearAwards };
}

const CLASSIFICHE = [
  { id: 'presenze', nome: 'Presenze', value: c => c.presenze, fmt: v => String(v) },
  { id: 'gol', nome: 'Gol', value: c => c.gol, fmt: v => String(v) },
  { id: 'assist', nome: 'Assist', value: c => c.assist || 0, fmt: v => String(v) },
  { id: 'mediaGol', nome: 'Media gol', value: c => c.mediaGol, min: 5, fmt: v => v.toFixed(2).replace('.', ',') },
  { id: 'percVittorie', nome: '% vittorie', value: c => c.percVittorie, min: 5, fmt: v => `${String(v).replace('.', ',')}%` },
  { id: 'mvp', nome: 'MVP', value: c => c.mvp, fmt: v => String(v) },
  { id: 'mediaVoto', nome: 'Media voto', value: c => c.mediaVoto, min: 3, fmt: v => v.toFixed(2).replace('.', ',') },
  { id: 'affidabilita', nome: 'Affidabilità', value: c => affidabilita(c), min: 5, fmt: v => `${Math.round(v)}%` },
  { id: 'magazziniere', nome: 'Magazziniere', value: c => (c.palloneVolte || 0) + (c.pettorineVolte || 0), fmt: v => String(v) }
];

function affidabilita(c) {
  if (!c || !c.presenze) return 0;
  const penal = (c.ritiriLastMinute || 0) + (c.assenze || 0);
  return Math.max(0, Math.round((1 - penal / (c.presenze + penal)) * 1000) / 10);
}

function rankings(playerStats, periodo, classificaId, activeIds) {
  const def = CLASSIFICHE.find(c => c.id === classificaId);
  const rows = [];
  for (const pid of activeIds || Object.keys(playerStats)) {
    const st = playerStats[pid];
    const c = !st ? null : periodo === 'carriera' ? st.totali : st.perAnno?.[periodo];
    if (!c || !c.presenze) continue;
    if (def.min && c.presenze < def.min) continue;
    const v = def.value(c);
    if (!v) continue;
    rows.push({ playerId: pid, valore: v });
  }
  rows.sort((a, b) => b.valore - a.valore);
  let pos = 0; let prev = null;
  rows.forEach((r, i) => { if (r.valore !== prev) { pos = i + 1; prev = r.valore; } r.pos = pos; });
  return rows;
}

function headToHead(matches, p1, p2) {
  const res = { insieme: 0, vittorieInsieme: 0, contro: 0, vittorieP1: 0, vittorieP2: 0, pareggi: 0 };
  for (const m of matches) {
    if (m.stato !== 'giocata' && m.stato !== 'archiviata') continue;
    const t1 = teamOf(m, p1); const t2 = teamOf(m, p2);
    if (!t1 || !t2) continue;
    const golA = Number(m.golA) || 0; const golB = Number(m.golB) || 0;
    const win = golA > golB ? 'a' : golB > golA ? 'b' : null;
    if (t1 === t2) { res.insieme++; if (win === t1) res.vittorieInsieme++; }
    else { res.contro++; if (!win) res.pareggi++; else if (win === t1) res.vittorieP1++; else res.vittorieP2++; }
  }
  return res;
}

function randomToken(len = 32) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = '';
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}

function slugify(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'giocatore';
}

  const code = e?.code || '';
  if (code.includes('permission-denied')) return 'Operazione non consentita. Le iscrizioni potrebbero essere chiuse o non hai i permessi.';
  if (code.includes('unavailable') || code.includes('network')) return 'Sei offline: riprova quando torna la connessione.';
  if (code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'Accesso annullato.';
  if (code.includes('popup-blocked')) return 'Il browser ha bloccato la finestra di accesso: consenti i popup e riprova.';
  if (code.includes('credential-already-in-use') || code.includes('email-already-in-use')) return 'Questo account Google è già collegato a un altro profilo.';
  if (code.includes('unauthorized-domain')) return 'Dominio non autorizzato in Firebase Auth: aggiungilo tra i domini autorizzati.';
  if (code.includes('operation-not-allowed')) return 'Metodo di accesso non abilitato nella console Firebase.';
  return e?.message || 'Si è verificato un errore.';
}

async function guard(fn, okMsg) {
  try {
    const r = await fn();
    if (okMsg) toast(okMsg);
    return r;
  } catch (e) {
    console.error(e);
    toast(errMsg(e), 'err');
    return undefined;
  }
}

function playerName(id) {
  if (!id) return '';
  if (String(id).startsWith('ospite:')) return guestName(id);
  const p = S.players[id];
  return p ? p.nome : 'Giocatore rimosso';
}

function guestName(key) {
  const [, pid, gid] = String(key).split(':');
  const cur = S.presences[pid]?.ospiti?.find(o => o.id === gid);
  if (cur) return `${cur.nome}`;
  for (const m of S.matches) {
    const n = m.ospitiNomi?.[key];

function avatarHtml(id, size = '') {
  if (String(id).startsWith('ospite:')) return `<span class="avatar guest ${size}" aria-hidden="true">+1</span>`;
  const p = S.players[id] || {};
  const foto = S.photos[id];
  if (foto) return `<span class="avatar foto ${size}" style="--c:${esc(p.colore || '#5B6B82')}"><img src="${esc(foto)}" alt=""></span>`;
  return `<span class="avatar ${size}" style="--c:${esc(p.colore || '#5B6B82')}" aria-hidden="true">${esc(p.avatar || '⚽')}</span>`;

const fotoInCorso = {};
function ensurePhoto(pid) {
  if (!pid || pid in S.photos || fotoInCorso[pid]) return;
  fotoInCorso[pid] = true;
  getDoc(doc(db, 'playerPhotos', pid))
    .then(snap => { S.photos[pid] = snap.exists() ? (snap.data().dataUrl || null) : null; render(); })

function starsHtml(v, max = 5) {
  const n = Math.round(Number(v) || 0);
  let s = '';
  for (let i = 1; i <= max; i++) s += i <= n ? '★' : '<span class="off">★</span>';
  return `<span class="stars" aria-label="${n} stelle su ${max}">${s}</span>`;
}

function fmtNum(v, dec = 1) {
  if (v == null || isNaN(v)) return '–';
  return Number(v).toFixed(dec).replace('.', ',').replace(/,0+$/, '');
}

function fmtTime(ts) {
  const t = ms(ts);
  if (!t) return '';
  const d = new Date(t);
  const ds = romeDateStr(d);
  const time = romeTimeStr(d);
  if (ds === todayStr()) return `oggi ${time}`;
  if (ds === addDaysStr(todayStr(), -1)) return `ieri ${time}`;
  return `${formatDataBreve(ds)} ${time}`;
}

function relCountdown(targetMs) {
  const diff = targetMs - nowMs();
  if (diff <= 0) return null;
  const h = Math.floor(diff / 3600e3);
  const d = Math.floor(h / 24);
  const m = Math.floor((diff % 3600e3) / 60e3);
  if (d >= 2) return `${d} giorni`;
  if (h >= 1) return `${h} h ${m} min`;
  return `${m} min`;
}

function mapsDirUrl(f) {
  if (!f) return null;
  if (f.lat != null && f.lon != null) return `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lon}`;
  if (f.linkMaps) return f.linkMaps;
  if (f.indirizzo) return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(f.indirizzo + ' ' + (f.citta || ''))}`;
  return null;
}
function mapsOpenUrl(f) {
  if (!f) return null;
  if (f.linkMaps) return f.linkMaps;
  if (f.lat != null && f.lon != null) return `https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}`;
  if (f.indirizzo) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.indirizzo + ' ' + (f.citta || ''))}`;
  return null;
}

function activePlayerIds() {
  return Object.entries(S.players).filter(([, p]) => p.attivo).map(([id]) => id)
    .sort((a, b) => S.players[a].nome.localeCompare(S.players[b].nome, 'it'));
}

function presencesForLogic(presences) {
  const out = {};
  for (const [pid, p] of Object.entries(presences || {})) {
    out[pid] = {
      stato: p.stato || null,
      tsIscrizione: ms(p.timestampIscrizione),
      ospiti: (p.ospiti || []).map(o => ({ id: o.id, nome: o.nome, ts: ms(o.timestamp) }))
    };
  }
  return out;
}

function matchField(m) {
  if (!m) return null;
  const live = S.fields[m.fieldId];
  return { ...(m.campoSnapshot || {}), ...(live || {}), id: m.fieldId };
}

function copyText(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => toast('Copiato negli appunti'));
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copiato negli appunti'); } catch (e) { toast('Copia non riuscita', 'err'); }
  ta.remove();
  return Promise.resolve();
}

function shareWhatsApp(text) {
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  const w = window.open(url, '_blank', 'noopener');
  if (!w) copyText(text);
}

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function lsGet(key, def) { try { const v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignora */ } }

/* =====================================================================
   SHEET (pannelli dal basso)
   ===================================================================== */
let sheetStack = [];

function openSheet({ title, body, foot = '', onMount, onClose, wide = false }) {
  const root = $('#sheet-root');
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = `
    <div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grabber"></div>
      <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Chiudi">✕</button></div>
      <div class="sheet-body">${body}</div>
      ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}
    </div>`;
  const close = () => {
    wrap.remove();
    sheetStack = sheetStack.filter(s => s !== api);
    if (onClose) onClose();
  };
  const api = { el: wrap.querySelector('.sheet'), close, setBody(html) { wrap.querySelector('.sheet-body').innerHTML = html; } };
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
  root.appendChild(wrap);
  sheetStack.push(api);
  document.body.style.overflow = 'hidden';
  const obs = new MutationObserver(() => { if (!root.children.length) { document.body.style.overflow = ''; obs.disconnect(); } });
  obs.observe(root, { childList: true });
  if (onMount) onMount(api.el, api);
  const first = api.el.querySelector('input, select, textarea');
  if (first && !('ontouchstart' in window)) first.focus();
  return api;
}

function closeAllSheets() { [...sheetStack].forEach(s => s.close()); }

function confirmSheet({ title, text, okText = 'Conferma', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const s = openSheet({
      title,
      body: `<p>${text}</p>`,
      foot: `<button class="btn" data-close>Annulla</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okText)}</button>`,
      onMount(el, api) { el.querySelector('[data-ok]').addEventListener('click', () => { done = true; api.close(); resolve(true); }); },
      onClose() { if (!done) resolve(false); }
    });
    return s;
  });
}

/* =====================================================================
   RENDER SCHEDULER E ROUTER
   ===================================================================== */
let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const name = parts[0] || 'partita';
  S.route = { name, id: parts[1] ? decodeURIComponent(parts[1]) : null, sub: parts[2] || null };
}
window.addEventListener('hashchange', () => { parseRoute(); window.scrollTo(0, 0); render(); });

function go(hash) {
  if (location.hash === hash) { parseRoute(); render(); } else location.hash = hash;
}

function doRender() {
  const gate = $('#gate');
  const shell = $('#shell');
  if (S.gate !== 'app') {
    shell.classList.add('hidden');
    gate.classList.remove('hidden');
    gate.innerHTML = renderGate();
    return;
  }
  gate.classList.add('hidden');
  shell.classList.remove('hidden');
  const view = $('#view');
  const y = window.scrollY;
  let html = '';
  try {
    switch (S.route.name) {
      case 'classifiche': html = renderArchivio('classifiche'); break;
      case 'storico': html = S.route.id ? renderPartitaDettaglio(S.route.id) : renderArchivio('partite'); break;
      case 'campi': html = S.route.id ? renderCampoDettaglio(S.route.id) : renderCampi(); break;
      case 'profilo': html = renderProfilo(S.myPlayerId); break;
      case 'giocatore': html = renderProfilo(S.route.id); break;
      case 'admin': html = S.isAdmin ? renderAdmin() : renderPartita(); break;
      default: html = renderPartita();
    }
  } catch (e) {
    console.error(e);
    html = `<div class="card"><p>Errore di visualizzazione: ${esc(e.message)}</p></div>`;
  }
  view.innerHTML = html;
  const mb = $('#matchbar');
  if (mb) { try { mb.innerHTML = renderMatchBar(); } catch (e) { console.error(e); mb.innerHTML = ''; } }
  window.scrollTo(0, y);
  const tab = S.route.name === 'partita' ? 'partita'
    : ['storico', 'classifiche', 'campi'].includes(S.route.name) ? 'storico'
    : (S.route.name === 'giocatore' && S.route.id !== S.myPlayerId) ? 'storico' : 'profilo';
  $$('.tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const pending = S.isAdmin && S.requests.filter(r => r.stato === 'in_attesa').length > 0;
  $('.tabbar button[data-tab="profilo"] .dot')?.classList.toggle('hidden', !pending);
  if (typeof afterRender === 'function') afterRender();
}

/* =====================================================================
   AZIONI (event delegation)
   ===================================================================== */
const ACTIONS = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

ACTIONS.go = el => go(el.dataset.href);
ACTIONS.back = () => history.length > 1 ? history.back() : go('#/partita');
ACTIONS.theme = () => {
  const cur = document.documentElement.dataset.theme;
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : (sysDark ? 'light' : 'dark');
  document.documentElement.dataset.theme = next;
  lsSet('tema', next);
};
ACTIONS.player = el => go(`#/giocatore/${encodeURIComponent(el.dataset.id)}`);

const params = new URLSearchParams(location.search);
if (params.get('invito')) {
  sessionStorage.setItem('invito', params.get('invito'));
  sessionStorage.setItem('invitoUrl', location.href);
  params.delete('invito');
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs ? `?${qs}` : '') + location.hash);
}

const IN_APP = isInAppBrowser(navigator.userAgent);

function teardown() {
  unsubs.forEach(u => { try { u(); } catch (e) { /* */ } });
  unsubs = [];
  matchUnsubs.forEach(u => { try { u(); } catch (e) { /* */ } });
  matchUnsubs = [];
  Object.values(postUnsubs).forEach(list => list.forEach(u => { try { u(); } catch (e) { /* */ } }));
  postUnsubs = {};
  Object.assign(S, {
    isAdmin: false, account: null, myPlayerId: null, players: {}, playersLoaded: false, fields: {}, playerStats: {}, statsLoaded: false,
    fieldStats: {}, yearAwards: {}, matches: [], matchesLoaded: false, currentId: null, presences: {}, presencesLoaded: false,
    currentLogs: [], levels: {}, requests: [], myVotes: {}, myReviews: {}, myRatings: {}, photos: {}, tabellino: {}, configExists: null, config: { ...DEFAULT_CONFIG }
  });
}

onAuthStateChanged(auth, async user => {
  teardown();
  S.user = user;
  if (!user) {
    if (sessionStorage.getItem('invito')) {
      S.gate = 'loading'; render();
      try { await signInAnonymously(auth); } catch (e) { S.gate = 'invite_error'; S.inviteErrorMsg = errMsg(e); render(); }
      return;
    }
    S.gate = IN_APP ? 'inapp' : 'login';
    render();
    return;
  }
  await bootstrap(user);
});

async function bootstrap(user) {
  S.gate = 'loading'; render();
  const safeGet = ref => getDoc(ref).catch(e => { console.warn(ref.path, e.code); return null; });
  const [adminSnap, accSnap] = await Promise.all([safeGet(doc(db, 'admins', user.uid)), safeGet(doc(db, 'accounts', user.uid))]);
  S.isAdmin = !!adminSnap?.exists();
  let acc = accSnap?.exists() ? accSnap.data() : null;

  const invite = sessionStorage.getItem('invito');
  if (invite) {
    sessionStorage.removeItem('invito');
    if (!acc) {
      const [pid, token] = invite.split('.');
      const data = {
        playerId: pid, metodo: user.isAnonymous ? 'link' : 'google', token: token || '',
        creatoIl: serverTimestamp(), ultimoAccesso: serverTimestamp()
      };
      if (!user.isAnonymous) data.email = user.email;
      try {
        await setDoc(doc(db, 'accounts', user.uid), data);
        acc = { ...data };
        if (IN_APP) S.inAppHint = true;
      } catch (e) {
        console.warn('Invito non valido', e);
        if (user.isAnonymous) { S.gate = 'invite_error'; S.inviteErrorMsg = null; render(); return; }
        toast('Invito non valido o revocato.', 'err');
      }
    }
  }

  if (acc) {
    S.account = acc;
    S.myPlayerId = acc.playerId;
    startSubscriptions();
    const last = lsGet('ultimoAccessoSalvato', 0);
    if (nowMs() - last > 12 * 3600e3) {
      updateDoc(doc(db, 'accounts', user.uid), { ultimoAccesso: serverTimestamp() }).then(() => lsSet('ultimoAccessoSalvato', nowMs())).catch(() => {});
    }
    S.gate = 'app';
    parseRoute();
    render();
    return;
  }

  if (S.isAdmin) {
    startSubscriptions();
    S.gate = 'admin_profile';
    render();
    return;
  }

  if (user.isAnonymous) { S.gate = 'invite_error'; S.inviteErrorMsg = null; render(); return; }

  const reqSnap = await safeGet(doc(db, 'profileRequests', user.uid));
  if (reqSnap?.exists()) {
    const r = reqSnap.data();
    S.gate = r.stato === 'rifiutata' ? 'rejected' : 'pending';
    if (S.gate === 'pending') waitForApproval(user);
  } else {
    S.gate = 'profile_form';
  }
  render();
}

function waitForApproval(user) {
  const u = onSnapshot(doc(db, 'accounts', user.uid), snap => {
    if (snap.exists()) { u(); bootstrap(user); }
  }, () => {});
  unsubs.push(u);
  const u2 = onSnapshot(doc(db, 'profileRequests', user.uid), snap => {
    if (snap.exists() && snap.data().stato === 'rifiutata') { S.gate = 'rejected'; render(); }
  }, () => {});
  unsubs.push(u2);
}

function startSubscriptions() {
  const onErr = what => e => {
    console.error(what, e);
    if (e.code === 'permission-denied' && !S.isAdmin && what === 'players') { S.gate = 'disabled'; render(); }
  };
  unsubs.push(onSnapshot(doc(db, 'config', 'app'), snap => {
    S.configExists = snap.exists();
    S.config = { ...DEFAULT_CONFIG, ...(snap.exists() ? snap.data() : {}) };
    S.config.nomiSquadre = { ...DEFAULT_CONFIG.nomiSquadre, ...(S.config.nomiSquadre || {}) };
    updateCurrentMatch();
    render();
  }, onErr('config')));
  unsubs.push(onSnapshot(collection(db, 'players'), snap => {
    const players = {};
    snap.forEach(d => { players[d.id] = { id: d.id, ...d.data() }; });
    S.players = players;
    S.playersLoaded = true;
    if (S.gate === 'app' && S.myPlayerId && players[S.myPlayerId] && !players[S.myPlayerId].attivo && !S.isAdmin) S.gate = 'disabled';
    render();
  }, onErr('players')));
  unsubs.push(onSnapshot(collection(db, 'fields'), snap => {
    const fields = {};
    snap.forEach(d => { fields[d.id] = { id: d.id, ...d.data() }; });
    S.fields = fields;
    updateCurrentMatch();
    render();
  }, onErr('fields')));
  unsubs.push(onSnapshot(collection(db, 'playerStats'), snap => {
    const st = {};
    snap.forEach(d => { st[d.id] = d.data(); });
    S.playerStats = st;
    S.statsLoaded = true;
    render();
  }, onErr('playerStats')));
  unsubs.push(onSnapshot(collection(db, 'fieldStats'), snap => {
    const st = {};
    snap.forEach(d => { st[d.id] = d.data(); });
    S.fieldStats = st;
    render();
  }, onErr('fieldStats')));
  unsubs.push(onSnapshot(collection(db, 'yearAwards'), snap => {
    const st = {};
    snap.forEach(d => { st[d.id] = d.data(); });
    S.yearAwards = st;
    render();
  }, onErr('yearAwards')));
  unsubs.push(onSnapshot(query(collection(db, 'matches'), orderBy('data', 'desc'), limit(400)), snap => {
    const list = [];
    snap.forEach(d => { list.push({ id: d.id, ...d.data() }); });
    S.matches = list;
    S.matchesLoaded = true;
    S.matchesFromCache = snap.metadata.fromCache;
    updateCurrentMatch();
    updatePostMatchSubscriptions();
    if (S.isAdmin) autoArchive();
    render();
  }, onErr('matches')));

  if (S.isAdmin) {
    unsubs.push(onSnapshot(collection(db, 'playerLevels'), snap => {
      const lv = {};
      snap.forEach(d => { lv[d.id] = d.data().livello; });
      S.levels = lv;
      render();
    }, onErr('playerLevels')));
    unsubs.push(onSnapshot(collection(db, 'profileRequests'), snap => {
      const list = [];
      snap.forEach(d => list.push({ uid: d.id, ...d.data() }));
      S.requests = list;
      render();
    }, onErr('profileRequests')));
  }
}

/* ---------- Partita corrente ---------- */

function updateCurrentMatch() {
  if (!S.matchesLoaded || S.configExists == null) return;
  const today = todayStr();
  const played = m => m.stato === 'giocata' || m.stato === 'archiviata';
  const upcoming = S.matches.filter(m => m.data >= today && !played(m)).sort((a, b) => a.data.localeCompare(b.data));
  let nextReg = nextWeekdayDate(today, Number(S.config.giornoSettimana));
  const sameDay = S.matches.find(m => m.id === nextReg);
  if (sameDay && played(sameDay)) nextReg = addDaysStr(nextReg, 7);
  let cur = upcoming.find(m => m.data <= nextReg) || null;
  if (!cur) {
    const fid = S.config.campoPredefinito;
    if (S.configExists && fid && S.fields[fid] && !S.creatingMatch[nextReg]) {
      S.creatingMatch[nextReg] = true;
      createRegularMatch(nextReg).catch(e => console.warn('Creazione partita', e)).finally(() => { setTimeout(() => { delete S.creatingMatch[nextReg]; }, 30000); });
    }
  }
  const newId = cur ? cur.id : null;
  if (newId !== S.currentId) {
    S.currentId = newId;
    subscribeCurrentMatch();
  }
}

function buildMatchData(dateStr, ora, fieldId, tipo) {
  const f = S.fields[fieldId] || {};
  const { inizio, chiusura } = computeMatchTimes(dateStr, ora, S.config);
  return {
    data: dateStr,
    anno: yearOf(dateStr),
    ora,
    inizio: Timestamp.fromDate(inizio),
    chiusura: Timestamp.fromDate(chiusura),
    fieldId,
    campoSnapshot: {
      nome: f.nome || '', indirizzo: f.indirizzo || '', citta: f.citta || '', lat: f.lat ?? null, lon: f.lon ?? null,
      coperto: !!f.coperto, linkMaps: f.linkMaps || ''
    },
    posti: Number(f.postiDefault) || 10,
    tipo,
    stato: 'aperta',
    creatoIl: serverTimestamp()
  };
}

async function createRegularMatch(dateStr) {
  const ref = doc(db, 'matches', dateStr);
  const data = buildMatchData(dateStr, S.config.ora, S.config.campoPredefinito, 'regolare');
  await runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if (snap.exists()) return;
    tx.set(ref, data);
  });
}

function subscribeCurrentMatch() {
  matchUnsubs.forEach(u => u());
  matchUnsubs = [];
  S.presences = {};
  S.presencesLoaded = false;
  S.currentLogs = [];
  S.tabellino = {};
  const id = S.currentId;
  if (!id) return;
  matchUnsubs.push(onSnapshot(collection(db, 'matches', id, 'tabellino'), snap => {
    const tb = {};
    snap.forEach(d => { tb[d.id] = d.data(); });
    S.tabellino = tb;
    render();
  }, e => console.error('tabellino', e)));
  matchUnsubs.push(onSnapshot(collection(db, 'matches', id, 'presences'), snap => {
    const pr = {};
    snap.forEach(d => { pr[d.id] = d.data(); });
    S.presences = pr;
    S.presencesLoaded = true;
    render();
  }, e => console.error('presences', e)));
  matchUnsubs.push(onSnapshot(query(collection(db, 'logs'), where('matchId', '==', id)), snap => {
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => (ms(a.timestamp) || nowMs()) - (ms(b.timestamp) || nowMs()));
    S.currentLogs = list;
    render();
  }, e => console.error('logs', e)));
}

function currentMatch() {
  return S.matches.find(m => m.id === S.currentId) || null;
}

function isPostOpen(m) {
  return m && m.stato === 'giocata' && ms(m.postPartitaFino) > nowMs();
}

function updatePostMatchSubscriptions() {
  if (!S.myPlayerId) return;
  const open = S.matches.filter(m => isPostOpen(m) && (m.giocatori || []).includes(S.myPlayerId));
  const ids = new Set(open.map(m => m.id));
  for (const id of Object.keys(postUnsubs)) {
    if (!ids.has(id)) { postUnsubs[id].forEach(u => u()); delete postUnsubs[id]; }
  }
  for (const m of open) {
    if (postUnsubs[m.id]) continue;
    postUnsubs[m.id] = [
      onSnapshot(doc(db, 'matches', m.id, 'mvpVotes', S.myPlayerId), snap => { S.myVotes[m.id] = snap.exists() ? snap.data() : null; render(); }, () => {}),
      onSnapshot(doc(db, 'matches', m.id, 'fieldReviews', S.myPlayerId), snap => { S.myReviews[m.id] = snap.exists() ? snap.data() : null; render(); }, () => {}),
      onSnapshot(doc(db, 'matches', m.id, 'ratings', S.myPlayerId), snap => { S.myRatings[m.id] = snap.exists() ? snap.data() : null; render(); }, () => {})
    ];
  }
}
